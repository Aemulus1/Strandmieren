const picassoHTML = "<!doctype html><html lang=\"nl\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Picasso Kubisme – Proefatelier</title><style>body{margin:0;background:#171b26;color:#f5f0df;font:15px system-ui}main{max-width:1050px;margin:auto;padding:18px}h1{margin:0 0 5px}p{color:#c8c9d1}canvas{width:100%;aspect-ratio:4/3;background:#ffffff;border-radius:10px}section{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}button,select{background:#35445c;color:white;border:1px solid #72809b;border-radius:8px;padding:10px;cursor:pointer}label{display:flex;align-items:center;gap:8px}input{accent-color:#f0bf4e}small{color:#c8c9d1}</style></head><body><main><h1>Picasso • Kubistische schildermotor</h1><p>Picasso-studie met sterk wisselende geometrische composities, soms zonder palmen, parasols of figuren. Geometrische constructie met meerdere gezichtspunten, geen expressionistisch filter.</p><section><button id=\"start\">▶ Start</button><button id=\"new\">↻ Nieuwe afbeelding</button><button id=\"pause\">Pauze</button><button id=\"save\">PNG opslaan</button><label>Schilderstappen <input id=\"speed\" type=\"range\" min=\"3000\" max=\"50000\" value=\"15000\" step=\"1000\"><output id=\"speedOut\">15000</output></label><label><input id=\"dots\" type=\"checkbox\" checked> CMYK-bolletjes</label></section><canvas id=\"art\" width=\"1000\" height=\"750\"></canvas><small id=\"status\">De geometrische vlakken worden door vier bolletjes geleidelijk gevuld.</small><p>Teekay &amp; Omnia · 2026 — experimentele kubistische motor</p></main><script>\nconst canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),W=1000,H=750;const layer=document.createElement('canvas');layer.width=W;layer.height=H;const pen=layer.getContext('2d');const speed=document.getElementById('speed'),status=document.getElementById('status');let seed=1,shapes=[],work=[],index=0,paused=true,markers=[];const colors=['#13a9c4','#cf
